<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="KioscoQR — experiencia de cobro simple y segura.">
  <title>KioscoQR</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <section class="kiosk" aria-labelledby="store-name">
      <header class="brand">
        <div class="brand-mark" aria-hidden="true">QR</div>
        <div>
          <p class="eyebrow">KioscoQR</p>
          <h1 id="store-name">Kiosco Maipú</h1>
        </div>
        <span class="station">Puesto 01</span>
      </header>

      <div id="app" class="content">
        <section class="intro">
          <p class="eyebrow">Cobro rápido</p>
          <h2>¿Cuánto querés pagar?</h2>
          <p class="muted">Ingresá el importe y revisá los datos antes de confirmar.</p>
        </section>

        <form id="payment-form" class="payment-form">
          <label for="amount">Importe</label>
          <div class="amount-wrap">
            <span aria-hidden="true">$</span>
            <input id="amount" name="amount" inputmode="decimal" autocomplete="off" placeholder="0,00" aria-describedby="amount-help" required>
          </div>
          <p id="amount-help" class="help">Monto en pesos argentinos.</p>

          <button class="primary" type="submit">Continuar</button>
        </form>

        <div class="trust" aria-label="Información del comercio">
          <span>✓ Comercio identificado</span>
          <span>✓ Datos protegidos</span>
        </div>
      </div>

      <footer>
        <a href="https://wa.me/" aria-label="Contactar por WhatsApp">Necesitás ayuda?</a>
        <span aria-hidden="true">·</span>
        <a href="#" id="review-link">Dejar una reseña</a>
      </footer>
    </section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
