<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="KioscoQR: información de cobro presencial y consulta de operaciones.">
  <meta name="robots" content="noindex, nofollow">
  <title>KioscoQR · Cobro presencial</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <section class="kiosk" aria-labelledby="store-name">
      <header class="brand">
        <div class="brand-mark" aria-hidden="true">QR</div>
        <div class="brand-copy">
          <p class="eyebrow">KioscoQR</p>
          <h1 id="store-name">KioscoQR</h1>
        </div>
        <span class="station">Cobro presencial</span>
      </header>

      <div id="app" class="content" aria-live="polite" aria-atomic="true">
        <section class="intro">
          <p class="eyebrow">Información</p>
          <h2>Preparando la consulta</h2>
          <p class="muted">Estamos validando el enlace. No ingreses datos de pago.</p>
        </section>
      </div>

      <footer aria-label="Contacto del comercio">
        <a href="#" id="contact-link" hidden rel="noopener noreferrer" target="_blank">Contactar al comercio</a>
        <a href="#" id="review-link" hidden rel="noopener noreferrer" target="_blank">Dejar una reseña</a>
      </footer>
    </section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
